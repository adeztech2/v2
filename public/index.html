<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADEZ XMD</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07131d;
      color: #e2f7ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 36px 48px;
      border: 1px solid #1dd3b0;
      border-radius: 18px;
      background: rgba(8, 17, 26, 0.92);
      box-shadow: 0 12px 34px rgba(0,0,0,0.35);
    }
    h1 {
      color: #7ef9ff;
      font-size: 2.8rem;
      margin-bottom: 12px;
    }
    p {
      color: #dfe9f8;
      margin: 8px 0;
    }
    .badge {
      color: #00f5d4;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ADEZ XMD</h1>
    <p class="badge">Bot activated successfully</p>
    <p>Connection established. The ADEZ XMD WhatsApp bot is ready and operational.</p>
  </div>
</body>
</html>
